[workspace]
name = "ocl-communication-ci"
channels = ["https://prefix.dev/liufang-robot/orocos", "conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
orocos-dev = "==0.1.5"
cmake = ">=3.20"
ninja = "*"

[target.linux-64.dependencies]
cxx-compiler = "*"

[target.linux-64.tasks]
check = "bash check.sh"

[target.win.tasks]
check = "pwsh -NoProfile -File check.ps1"
